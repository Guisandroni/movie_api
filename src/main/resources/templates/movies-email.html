<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Seus Filmes Favoritos</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }
        .header {
            background-image: linear-gradient(to right, #4f46e5, #7c3aed, #ec4899);
            padding: 1.5rem;
            color: #ffffff;
        }
        .header h1 {
            font-size: 1.875rem;
            font-weight: bold;
            margin: 0 0 0.5rem 0;
        }
        .content {
            padding: 1.5rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 0;
        }
        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .empty-state p {
            color: #4b5563;
            font-size: 1.125rem;
            margin: 0;
        }
        .empty-state .subtext {
            color: #6b7280;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
        .movies-list {
            display: grid;
            gap: 2rem;
        }
        .movie-card {
            background-color: #ffffff;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            transition: box-shadow 0.3s ease-in-out;
        }
        .movie-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .movie-card-content {
            padding: 1.5rem;
        }
        .movie-title-container {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }
        .movie-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1f2937;
            margin: 0;
        }
        .release-year {
            margin-left: 1rem;
            padding: 0.25rem 0.75rem;
            background-color: #e0e7ff;
            color: #3730a3;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 9999px;
            white-space: nowrap;
        }
        .movie-description {
            color: #4b5563;
            font-size: 1rem;
            line-height: 1.625;
            margin: 1rem 0;
        }
        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .category {
            background-color: #f3e8ff;
            color: #86198f;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
        }
        .footer {
            background-color: #f3f4f6;
            padding: 1.25rem 1.5rem;
            border-top: 1px solid #e5e7eb;
            text-align: center;
        }
        .footer p {
            color: #4b5563;
            font-size: 0.875rem;
            margin: 0;
        }
        .footer .subtext {
            color: #6b7280;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎬 Seus Filmes Favoritos</h1>
    </div>

    <div class="content">
        <div th:if="${#lists.isEmpty(movies)}" class="empty-state">
            <div class="empty-state-icon">🎥</div>
            <p>Nenhum filme encontrado no momento.</p>
            <p class="subtext">Adicione filmes à sua lista para vê-los aqui!</p>
        </div>

        <div th:unless="${#lists.isEmpty(movies)}" class="movies-list">
            <div th:each="movie : ${movies}" class="movie-card">
                <div class="movie-card-content">
                    <div class="movie-title-container">
                        <h2 class="movie-title" th:text="${movie.title}">
                            Título do Filme
                        </h2>
                        <span class="release-year"
                              th:text="${#temporals.format(movie.release_date, 'yyyy')}">
                            2024
                        </span>
                    </div>

                    <p class="movie-description" th:text="${movie.description}">
                        Uma descrição envolvente do filme que captura a essência da história e mantém o espectador interessado em assistir.
                    </p>

                    <div class="categories">
                        <span th:each="category : ${movie.categories}" class="category">
                            <span th:text="${category.name}"></span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
</div>
</body>
</html>
